<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Feedback Survey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
    <header>
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>

    <main>
      <form id="survey-form">
        <fieldset>
            <legend>Personal Information</legend>
            <label id="name-label" for="name">Name</label>
            <input 
            id="name" 
            type="text" 
            name="name"
            placeholder="Enter Your Name" 
            required 
            />

            <br>
            
            <label id="email-label" for="email">Email</label>
            <input 
            id="email" 
            type="email"
            name="email" 
            placeholder="Enter Your Email" 
            required 
            />
            
            <br>

            <label id="number-label" for="number">Age (Optional)</label>
            <input 
            id="number" 
            type="number"
            name="number" 
            min="10" 
            max="110" 
            placeholder="Age" 
            />
        </fieldset>

        <fieldset>
            <legend>Answer The Following Questions</legend>

        <!-- Select Options Group -->
            <label for="dropdown">Which option best describes your current role?</label>
              <br>
              <select id="dropdown" name="role">
                <option value="" disabled selected>Select your current role</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="fullstack">Full Stack Developer</option>
                <option value="other">Other / Student</option>
              </select>

            <br><br>

        <!-- Radio Buttons Group -->
            <legend>Would you recommend freeCodeCamp to a friend?</legend>
            <input id="yes-option" type="radio" name="recommend" value="yes" />
            <label for="yes-option">Yes</label>
            
            <input id="maybe-option" type="radio" name="recommend" value="maybe" />
            <label for="maybe-option">Maybe</label>

            <input id="no-option" type="radio" name="recommend" value="no" />
            <label for="no-option">No</label>

            <br><br>

        <!-- Checkboxes Group -->
            <legend>What would you like to see improved? (Check all that apply)</legend>
            
            <input type="checkbox" id="front-end" name="improve" value="front-end" />
            <label for="front-end">Front-end Projects</label>

            <input type="checkbox" id="back-end" name="improve" value="back-end" />
            <label for="back-end">Back-end Projects</label>

            <input type="checkbox" id="data-visualization" name="improve" value="data-visualization" />
            <label for="data-visualization">Data Visualization</label>

            <input type="checkbox" id="challenges" name="improve" value="challenges" />
            <label for="challenges">Challenges</label>

            <br><br>
            
        <!-- Textarea Comments -->
            <label for="comments">Any comments or suggestions?</label>
            <br>
            <textarea 
            id="comments" 
            name="comments" 
            placeholder="Enter your comment here..."
            ></textarea>
        </fieldset>

        <!-- Submission Button -->
        <button id="submit" type="submit">Submit</button>
      </form>
  </main>
</body>
</html>
